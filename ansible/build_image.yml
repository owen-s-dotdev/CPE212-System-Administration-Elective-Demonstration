# Playbook 1: install Docker and BUILD the portfolio image on every VM.​
# ansible-playbook build_image.yml​
- name: Build the portfolio Docker image on CentOS and Ubuntu
  hosts: webservers
  become: true

  roles:
    - role: docker
      tags: install

  tasks:
    - name: Create the build directory
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory
        mode: "0755"
      register: copy_result
      retries: 3
      delay: 3
      until: copy_result is succeeded

    - name: Copy the Dockerfile and nginx template
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../{{ item }}"
        dest: "{{ build_dir }}/"
        mode: preserve
      loop:
        - Dockerfile
        - .dockerignore
        - docker
      register: copy_docker
      retries: 3
      delay: 10
      until: copy_docker is succeeded

    - name: Copy the web app source
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../app"
        dest: "{{ build_dir }}/"
        mode: preserve
      register: copy_app
      retries: 5
      delay: 3
      until: copy_app is succeeded

    - name: Build the image from the Dockerfile​
      community.docker.docker_image:
        name: "{{ image_name }}"
        tag: "{{ image_tag }}"
        source: build
        build:
          path: "{{ build_dir }}"
          dockerfile: Dockerfile
          pull: false #Rebuild only when the copied files changed (keeps reruns idempotent).​
        force_source: "{{ copy_docker.changed or copy_app.changed }}"
        state: present
      register: image_build
      retries: 5
      delay: 5
      until: image_build is succeeded

    - name: Also tag the image as latest
      community.docker.docker_image_tag:
        name: "{{ image_name }}:{{ image_tag }}"
        repository:
          - "{{ image_name }}:latest"

    - name: Read the built image details
      community.docker.docker_image_info:
        name: "{{ image_name }}:{{ image_tag }}"
      register: image_info

    - name: Show the image that was built
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "Image: {{ image_name }}:{{ image_tag }}"
          - "ID: {{ image_info.images[0].Id[7:19] }}"
          - "Size: {{ (image_info.images[0].Size / 1024 / 1024) | round(1) }} MB"
          - "Created: {{ image_info.images[0].Created }}"
